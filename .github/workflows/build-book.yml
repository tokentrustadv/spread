name: Build Book

on:
  push:
    branches: ["**"]
    paths:
      - "the-commitment-chain/book.md"
      - "the-commitment-chain/cover.*"
      - "the-commitment-chain/metadata.yaml"
      - "the-commitment-chain/templates/**"
      - "the-commitment-chain/filters/**"
      - "the-commitment-chain/Makefile"
      - ".github/workflows/build-book.yml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: the-commitment-chain

jobs:
  build:
    name: Build PDF / EPUB / DOCX / HTML
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pandoc (pinned release build)
        env:
          PANDOC_VERSION: "3.1.11.1"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version

      - name: Install XeLaTeX and supporting tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            fonts-texgyre \
            poppler-utils \
            qpdf \
            libimage-exiftool-perl
          pip install --break-system-packages "img2pdf==0.6.3"

      - name: Build all formats
        run: make all

      - name: Verify expected outputs exist
        run: |
          set -euo pipefail
          for f in the-commitment-chain.pdf the-commitment-chain.epub the-commitment-chain.docx the-commitment-chain.html; do
            test -s "dist/$f" || { echo "::error::Missing or empty dist/$f"; exit 1; }
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-commitment-chain-build
          path: the-commitment-chain/dist/
          if-no-files-found: error
          retention-days: 90
